spring:
  profiles:
    active: dev
  application:
    name: nobilesol.api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: always
  servlet:
    context-path: /api/v1

jwt:
  secret: "652ca2150061c0de8f8e1927b996fafd"
  expiration: 86400000